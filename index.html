<!DOCTYPE html>
<script>
  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();

  const coinsElement = document.getElementById("coins");
  const userElement = document.getElementById("user");
  const statusElement = document.getElementById("status");
  const tapButton = document.getElementById("tapButton");

  let coins = 0;
  let tapping = false;

  const telegramUser = tg.initDataUnsafe?.user;

  if (telegramUser) {
    userElement.textContent =
      "👤 " + (telegramUser.first_name || "Player");
  } else {
    userElement.textContent = "👤 Telegram Player";
  }

  async function connectUser() {
    try {
      const response = await fetch(
        "https://tzexlawaafxjuwbewrab.supabase.co/functions/v1/telegram-user",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            initData: tg.initData
          })
        }
      );

      const data = await response.json();

      if (!response.ok) {
        statusElement.textContent =
          "⚠️ Account connection failed";
        console.log(data);
        return false;
      }

      return true;

    } catch (error) {
      statusElement.textContent =
        "⚠️ Connection error";
      console.log(error);
      return false;
    }
  }

  async function getBalance() {
    try {
      statusElement.textContent = "🔄 Loading coins...";

      const response = await fetch(
        "https://tzexlawaafxjuwbewrab.supabase.co/functions/v1/get-balance",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            initData: tg.initData
          })
        }
      );

      const data = await response.json();

      if (!response.ok) {
        statusElement.textContent =
          "⚠️ Could not load balance";
        console.log(data);
        return;
      }

      coins = Number(data.coins) || 0;
      coinsElement.textContent = coins;

      statusElement.textContent =
        "✅ Telegram account connected";

    } catch (error) {
      statusElement.textContent =
        "⚠️ Balance connection error";
      console.log(error);
    }
  }

  async function tapCoin() {
    if (tapping) return;

    tapping = true;
    tapButton.disabled = true;

    try {
      const response = await fetch(
        "https://tzexlawaafxjuwbewrab.supabase.co/functions/v1/tap-coin",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            initData: tg.initData
          })
        }
      );

      const data = await response.json();

      if (!response.ok) {
        statusElement.textContent =
          "⚠️ Tap failed";
        console.log(data);
        return;
      }

      coins = Number(data.coins) || 0;
      coinsElement.textContent = coins;

      statusElement.textContent =
        "✅ Coin added";

      if (tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred("light");
      }

    } catch (error) {
      statusElement.textContent =
        "⚠️ Tap connection error";
      console.log(error);

    } finally {
      tapping = false;
      tapButton.disabled = false;
    }
  }

  tapButton.addEventListener("click", tapCoin);

  async function startGame() {
    const connected = await connectUser();

    if (connected) {
      await getBalance();
    }
  }

  startGame();
</script>
