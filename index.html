<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coin Rush Game</title>

  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #1e3a8a);
      color: white;
      text-align: center;
      min-height: 100vh;
    }

    .container {
      padding: 30px 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .user {
      margin-bottom: 25px;
      opacity: 0.9;
    }

    .coins {
      font-size: 42px;
      font-weight: bold;
      margin: 30px 0;
    }

    button {
      border: none;
      border-radius: 20px;
      padding: 20px 40px;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      background: #facc15;
      color: #111827;
    }

    button:active {
      transform: scale(0.95);
    }

    .status {
      margin-top: 25px;
      font-size: 14px;
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>🪙 Coin Rush</h1>

    <div class="user" id="user">Connecting...</div>

    <div class="coins">
      🪙 <span id="coins">0</span>
    </div>

    <button id="tapButton">TAP +1</button>

    <div class="status" id="status">
      Connecting your Telegram account...
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    const coinsElement = document.getElementById("coins");
    const userElement = document.getElementById("user");
    const statusElement = document.getElementById("status");
    const tapButton = document.getElementById("tapButton");

    let coins = Number(localStorage.getItem("coins")) || 0;

    coinsElement.textContent = coins;

    const telegramUser = tg.initDataUnsafe?.user;

    if (telegramUser) {
      userElement.textContent =
        "👤 " + (telegramUser.first_name || "Player");
    } else {
      userElement.textContent = "👤 Telegram Player";
    }

    async function connectUser() {
      try {
        const response = await fetch(
          "https://tzexlawaafxjuwbewrab.supabase.co/functions/v1/telegram-user",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              initData: tg.initData
            })
          }
        );

        const data = await response.json();

        if (response.ok) {
          statusElement.textContent = "✅ Telegram account connected";
        } else {
          statusElement.textContent =
            "⚠️ Account connection failed";
          console.log(data);
        }

      } catch (error) {
        statusElement.textContent =
          "⚠️ Connection error";
        console.log(error);
      }
    }

    connectUser();

    tapButton.addEventListener("click", function () {
      coins += 1;
      coinsElement.textContent = coins;

      localStorage.setItem("coins", coins);

      if (tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred("light");
      }
    });
  </script>

</body>
</html>
